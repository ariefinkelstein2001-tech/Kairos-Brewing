<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pasaporte Cervecero — Kairos Brewing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --orange:#F8AA41;
    --orange-deep:#E0932A;
    --blue:#274AB0;
    --blue-deep:#1B3785;
    --ink:#111111;
    --ink-soft:#1D1D1D;
    --paper:#FFF8EC;
    --muted:#8A8A8A;
    --line:#2A2A2A;
    --err:#C0392B;
  }
  *{box-sizing:border-box;}
  #kairosPassportApp{margin:0;background:var(--orange);color:var(--ink);font-family:'Jost',sans-serif;}
  .wrap{max-width:460px;margin:0 auto;padding:26px 18px 56px;}
  h1,h2,h3{font-family:'Jost',sans-serif;font-weight:700;text-transform:uppercase;margin:0;letter-spacing:.01em;}

  .header{text-align:center;margin-bottom:22px;}
  .hero-video{width:100%;max-width:260px;margin:0 auto 18px;display:block;border-radius:10px;overflow:hidden;}
  .hero-video video{width:100%;height:auto;display:block;}
  .header img.logo{height:64px;width:auto;margin-bottom:6px;}
  .header h1{font-size:30px;line-height:1.05;margin-top:6px;}
  .header .sub{font-size:13px;color:var(--ink);opacity:.75;margin-top:8px;font-weight:500;}

  .card{background:var(--ink);border-radius:6px;padding:20px;position:relative;color:var(--paper);}
  .card::after{content:"";position:absolute;top:14px;right:14px;width:10px;height:10px;border-radius:50%;background:var(--blue);}

  label{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--paper);opacity:.6;margin:16px 0 6px;font-weight:600;}
  input[type=text],input[type=password]{width:100%;background:var(--ink-soft);border:1.5px solid var(--line);color:var(--paper);padding:12px 12px;border-radius:4px;font-family:'Jost',sans-serif;font-size:15px;font-weight:500;}
  input[type=text]:focus,input[type=password]:focus{outline:none;border-color:var(--blue);}

  .tabs{display:flex;gap:8px;margin-bottom:4px;}
  .tab-btn{flex:1;background:var(--ink-soft);border:1.5px solid var(--line);color:var(--paper);opacity:.55;padding:10px;border-radius:4px;font-family:'Jost',sans-serif;font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.05em;cursor:pointer;}
  .tab-btn.active{opacity:1;border-color:var(--orange);color:var(--orange);}

  .upload-zone{border:2px dashed var(--line);border-radius:5px;padding:22px 14px;text-align:center;margin-top:8px;cursor:pointer;transition:border-color .15s;}
  .upload-zone:hover{border-color:var(--orange);}
  .upload-zone.filled{border-style:solid;border-color:var(--blue);}
  .upload-zone p{margin:0;font-size:13px;color:var(--paper);opacity:.7;font-weight:500;}
  .stamp-icon{width:40px;height:40px;border-radius:50%;border:2px solid var(--orange);display:flex;align-items:center;justify-content:center;margin:0 auto 10px;}
  .stamp-icon svg{width:20px;height:20px;stroke:var(--orange);}
  #photoPreview{max-width:100%;max-height:120px;border-radius:4px;margin-top:10px;display:none;}

  button.primary{width:100%;margin-top:20px;background:var(--blue);color:#fff;border:none;padding:15px;border-radius:4px;font-family:'Jost',sans-serif;font-weight:700;font-size:15px;letter-spacing:.05em;text-transform:uppercase;cursor:pointer;}
  button.primary:disabled{background:var(--line);color:var(--muted);cursor:not-allowed;}
  button.ghost{width:100%;background:transparent;border:1.5px solid var(--line);color:var(--paper);padding:10px;border-radius:4px;font-size:12px;cursor:pointer;margin-top:10px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;}
  .msg{font-size:12px;margin-top:10px;font-weight:600;display:none;}
  .msg.error{color:var(--err);}
  .msg.ok{color:#8FBF6B;}

  .top-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}
  .greeting{font-size:13px;opacity:.8;font-weight:500;}
  .logout{font-size:11px;color:var(--paper);opacity:.5;cursor:pointer;text-transform:uppercase;letter-spacing:.05em;}

  .progress-row{display:flex;justify-content:center;gap:10px;margin:18px 0 4px;}
  .beer-dot{width:34px;height:34px;border-radius:50%;border:2px solid var(--orange);display:flex;align-items:center;justify-content:center;font-size:15px;}
  .beer-dot.filled{background:var(--orange);}
  .progress-label{text-align:center;font-size:12px;opacity:.7;margin-bottom:6px;font-weight:600;}

  .wheel-stage{display:flex;flex-direction:column;align-items:center;margin:26px 0 8px;}
  .wheel-holder{position:relative;width:270px;height:270px;}
  .pointer{position:absolute;top:-8px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:13px solid transparent;border-right:13px solid transparent;border-top:24px solid var(--blue);z-index:3;}
  .wheel{width:100%;height:100%;border-radius:50%;position:relative;border:7px solid var(--ink);box-shadow:inset 0 0 0 2px var(--orange);transition:transform 4.5s cubic-bezier(.12,.66,.05,1);}
  .wheel-center{position:absolute;top:50%;left:50%;width:48px;height:48px;background:var(--ink);border-radius:50%;transform:translate(-50%,-50%);z-index:2;display:flex;align-items:center;justify-content:center;border:3px solid var(--orange);}
  .wheel-center span{font-family:'Jost',sans-serif;font-weight:800;font-size:10px;color:var(--orange);letter-spacing:.05em;}
  .slice-label{position:absolute;top:50%;left:50%;width:118px;text-align:right;font-size:10.5px;font-weight:700;transform-origin:0 0;color:#fff;text-transform:uppercase;letter-spacing:.02em;}

  .result{text-align:center;margin-top:22px;padding:22px 20px;border-radius:6px;background:var(--ink);border:2px solid var(--blue);display:none;color:var(--paper);}
  .result .eyebrow{font-size:11px;letter-spacing:.2em;text-transform:uppercase;font-weight:700;color:var(--orange);}
  .result h2{font-size:22px;margin:10px 0 4px;color:#fff;}
  .code{font-family:'Jost',sans-serif;font-weight:700;letter-spacing:.15em;font-size:18px;background:var(--ink-soft);padding:11px;border-radius:4px;margin-top:14px;border:1.5px dashed var(--blue);}

  .staff-link{text-align:center;margin-top:32px;font-size:11px;color:var(--ink);opacity:.55;cursor:pointer;font-weight:600;text-transform:uppercase;letter-spacing:.05em;}
  .staff-link:hover{opacity:.85;}
  .admin{margin-top:14px;}
  .entry-row{display:flex;justify-content:space-between;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line);font-size:12.5px;gap:10px;color:var(--paper);}
  .entry-row .meta{flex:1;}
  .entry-row .code-tag{color:var(--orange);font-weight:700;letter-spacing:.05em;}
  .badge{font-size:10px;padding:3px 9px;border-radius:10px;white-space:nowrap;font-weight:700;text-transform:uppercase;letter-spacing:.03em;}
  .badge.pending{background:var(--line);color:var(--paper);}
  .badge.done{background:var(--blue);color:#fff;}
  .mini-btn{font-size:11px;background:transparent;border:1px solid var(--line);color:var(--paper);padding:4px 9px;border-radius:4px;cursor:pointer;font-weight:600;}
  .empty{font-size:12px;color:var(--paper);opacity:.6;text-align:center;padding:14px 0;}
</style>
</head>
<body>
<div id="kairosPassportApp">
<div class="wrap">

  <div class="hero-video">
    <video autoplay muted loop playsinline>
      <source src="https://cdn.shopify.com/videos/c/o/v/d6ce6b11803241d4b600785a24b6c508.mp4" type="video/mp4">
    </video>
  </div>

  <div class="header">
    <img class="logo" src="https://cdn.shopify.com/s/files/1/0668/0081/2327/files/logobrewing.png?v=1785251709" alt="Kairos Brewing">
    <h1>Pasaporte cervecero</h1>
    <div class="sub">Toma 5 chelas Kairos y gana premios</div>
  </div>

  <!-- LOGIN / REGISTRO -->
  <div class="card" id="authCard">
    <div class="tabs">
      <button class="tab-btn active" id="tabLogin">Iniciar sesión</button>
      <button class="tab-btn" id="tabRegister">Crear cuenta</button>
    </div>

    <div id="loginForm">
      <label>Usuario</label>
      <input type="text" id="loginUser" placeholder="Tu usuario">
      <label>Contraseña</label>
      <input type="password" id="loginPass" placeholder="Tu contraseña">
      <button class="primary" id="loginBtn">Entrar</button>
      <p class="msg error" id="loginMsg"></p>
    </div>

    <div id="registerForm" style="display:none">
      <label>Usuario</label>
      <input type="text" id="regUser" placeholder="Elige un usuario">
      <label>Contraseña</label>
      <input type="password" id="regPass" placeholder="Elige una contraseña">
      <label>Whatsapp o email</label>
      <input type="text" id="regContact" placeholder="Para avisarte de tus premios">
      <button class="primary" id="registerBtn">Crear cuenta</button>
      <p class="msg error" id="registerMsg"></p>
    </div>
  </div>

  <!-- APP LOGUEADA -->
  <div class="card" id="appCard" style="display:none">
    <div class="top-row">
      <div class="greeting">Hola, <strong id="greetingName"></strong></div>
      <div class="logout" id="logoutBtn">Cerrar sesión</div>
    </div>

    <div class="progress-label" id="progressLabel">0 / 5 cervezas</div>
    <div class="progress-row" id="progressRow"></div>

    <div id="uploadSection">
      <label>Foto de tu chela Kairos de hoy</label>
      <div class="upload-zone" id="uploadZone">
        <div class="stamp-icon"><svg viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M3 12c2-4 4-6 9-6s7 2 9 6c-2 4-4 6-9 6s-7-2-9-6z"/><circle cx="12" cy="12" r="2.4"/></svg></div>
        <p id="uploadText">Toca para subir la foto</p>
        <img id="photoPreview">
      </div>
      <input type="file" id="fileInput" accept="image/*" style="display:none">
      <button class="primary" id="uploadBtn" disabled>Registrar cerveza de hoy</button>
      <p class="msg" id="uploadMsg"></p>
    </div>

    <div id="unlockedSection" style="display:none">
      <p style="text-align:center;font-size:13px;font-weight:600;opacity:.85;margin-top:16px">¡Desbloqueaste la ruleta! Gira para ver tu premio</p>
      <button class="primary" id="spinBtn">Girar la ruleta</button>
    </div>
  </div>

  <div class="wheel-stage" id="wheelStage" style="display:none">
    <div class="wheel-holder">
      <div class="pointer"></div>
      <div class="wheel" id="wheel">
        <div class="wheel-center"><span>KBC</span></div>
      </div>
    </div>
  </div>

  <div class="result" id="resultBox">
    <div class="eyebrow">Premio</div>
    <h2 id="resultTitle"></h2>
    <div class="code" id="resultCode"></div>
  </div>

  <div class="staff-link" id="staffToggle">Panel de staff</div>

  <div class="admin" id="adminPanel" style="display:none">
    <div class="card">
      <label>PIN de staff</label>
      <input type="text" id="pinInput" placeholder="PIN">
      <button class="primary" id="pinBtn" style="margin-top:10px">Entrar</button>
      <div id="adminList" style="display:none;margin-top:16px">
        <h3 style="margin-bottom:10px;font-size:14px">Canjes recientes</h3>
        <div id="entriesContainer"><div class="empty">Cargando...</div></div>
        <button class="ghost" id="refreshBtn">Actualizar lista</button>
      </div>
    </div>
  </div>

</div>
</div>

<script>
// PEGA AQUÍ LA URL de tu Web App de Google Apps Script
const WEBAPP_URL = 'https://script.google.com/macros/s/AKfycbwlR9zmKlCU2UaSTr74YwcTdhX7CdfW2-iTq-oKYSUUH4g3GM3oZ3fFnkS09MfrP4Do/exec';
const BEERS_NEEDED = 5;

async function callBackend(payload){
  const res = await fetch(WEBAPP_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(payload)
  });
  return res.json();
}

const PRIZES = [
  { id:'sigue', label:'Sigue participando', weight:10, color:'#2A2A2A' },
  { id:'dcto10', label:'10% dcto próxima compra', weight:10, color:'#1B3785' },
  { id:'cerveza', label:'Cerveza gratis', weight:60, color:'#274AB0' },
  { id:'pack6', label:'Pack de 6 cervezas', weight:5, color:'#E0932A' },
  { id:'merch', label:'Merch Kairos', weight:5, color:'#F8AA41' },
  { id:'growler', label:'Growler Kairos', weight:10, color:'#C0392B' },
];

let session = { username:'', password:'' };
let uploadedPhoto = null;

// ---------- Tabs login/registro ----------
const tabLogin = document.getElementById('tabLogin');
const tabRegister = document.getElementById('tabRegister');
const loginForm = document.getElementById('loginForm');
const registerForm = document.getElementById('registerForm');

tabLogin.addEventListener('click', () => {
  tabLogin.classList.add('active'); tabRegister.classList.remove('active');
  loginForm.style.display = 'block'; registerForm.style.display = 'none';
});
tabRegister.addEventListener('click', () => {
  tabRegister.classList.add('active'); tabLogin.classList.remove('active');
  registerForm.style.display = 'block'; loginForm.style.display = 'none';
});

// ---------- Registro ----------
document.getElementById('registerBtn').addEventListener('click', async () => {
  const username = document.getElementById('regUser').value.trim();
  const password = document.getElementById('regPass').value;
  const contact = document.getElementById('regContact').value.trim();
  const msg = document.getElementById('registerMsg');
  msg.style.display = 'none';
  if (!username || !password || !contact){
    msg.textContent = 'Completa todos los campos.';
    msg.style.display = 'block';
    return;
  }
  try {
    const res = await callBackend({ action:'register', username, password, contact });
    if (res.error){
      msg.textContent = res.error;
      msg.style.display = 'block';
      return;
    }
    session = { username, password };
    enterApp(res.beerCount, res.uploadedToday);
  } catch(e){
    msg.textContent = 'No se pudo conectar con el servidor.';
    msg.style.display = 'block';
  }
});

// ---------- Login ----------
document.getElementById('loginBtn').addEventListener('click', async () => {
  const username = document.getElementById('loginUser').value.trim();
  const password = document.getElementById('loginPass').value;
  const msg = document.getElementById('loginMsg');
  msg.style.display = 'none';
  if (!username || !password){
    msg.textContent = 'Completa usuario y contraseña.';
    msg.style.display = 'block';
    return;
  }
  try {
    const res = await callBackend({ action:'login', username, password });
    if (res.error){
      msg.textContent = res.error;
      msg.style.display = 'block';
      return;
    }
    session = { username, password };
    enterApp(res.beerCount, res.uploadedToday);
  } catch(e){
    msg.textContent = 'No se pudo conectar con el servidor.';
    msg.style.display = 'block';
  }
});

// ---------- Logout ----------
document.getElementById('logoutBtn').addEventListener('click', () => {
  session = { username:'', password:'' };
  document.getElementById('appCard').style.display = 'none';
  document.getElementById('authCard').style.display = 'block';
  document.getElementById('wheelStage').style.display = 'none';
  document.getElementById('resultBox').style.display = 'none';
  uploadedPhoto = null;
});

function enterApp(beerCount, uploadedToday){
  document.getElementById('authCard').style.display = 'none';
  document.getElementById('appCard').style.display = 'block';
  document.getElementById('greetingName').textContent = session.username;
  renderProgress(beerCount, uploadedToday);
}

function renderProgress(beerCount, uploadedToday){
  const row = document.getElementById('progressRow');
  row.innerHTML = '';
  for (let i=1;i<=BEERS_NEEDED;i++){
    const dot = document.createElement('div');
    dot.className = 'beer-dot' + (i <= beerCount ? ' filled' : '');
    dot.textContent = i <= beerCount ? '🍺' : '';
    row.appendChild(dot);
  }
  document.getElementById('progressLabel').textContent = beerCount + ' / ' + BEERS_NEEDED + ' cervezas';

  const uploadSection = document.getElementById('uploadSection');
  const unlockedSection = document.getElementById('unlockedSection');
  const uploadBtn = document.getElementById('uploadBtn');
  const uploadMsg = document.getElementById('uploadMsg');

  if (beerCount >= BEERS_NEEDED){
    uploadSection.style.display = 'none';
    unlockedSection.style.display = 'block';
  } else {
    uploadSection.style.display = 'block';
    unlockedSection.style.display = 'none';
    if (uploadedToday){
      uploadBtn.disabled = true;
      uploadMsg.textContent = 'Ya registraste tu cerveza de hoy. Vuelve mañana.';
      uploadMsg.className = 'msg ok';
      uploadMsg.style.display = 'block';
    } else {
      uploadMsg.style.display = 'none';
    }
  }
}

// ---------- Subida de foto diaria ----------
const uploadZone = document.getElementById('uploadZone');
const fileInput = document.getElementById('fileInput');
const uploadText = document.getElementById('uploadText');
const photoPreview = document.getElementById('photoPreview');
const uploadBtn = document.getElementById('uploadBtn');

uploadZone.addEventListener('click', () => fileInput.click());

fileInput.addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    const img = new Image();
    img.onload = () => {
      const canvas = document.createElement('canvas');
      const maxW = 500;
      const scale = Math.min(1, maxW / img.width);
      canvas.width = img.width * scale;
      canvas.height = img.height * scale;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      uploadedPhoto = canvas.toDataURL('image/jpeg', 0.6);
      photoPreview.src = uploadedPhoto;
      photoPreview.style.display = 'block';
      uploadText.textContent = 'Foto lista';
      uploadZone.classList.add('filled');
      if (!uploadBtn.disabled || uploadedPhoto) uploadBtn.disabled = false;
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
});

uploadBtn.addEventListener('click', async () => {
  const msg = document.getElementById('uploadMsg');
  if (!uploadedPhoto){
    msg.textContent = 'Primero sube una foto.';
    msg.className = 'msg error';
    msg.style.display = 'block';
    return;
  }
  uploadBtn.disabled = true;
  try {
    const res = await callBackend({ action:'uploadBeer', username:session.username, password:session.password, photo:uploadedPhoto });
    if (res.error){
      msg.textContent = res.error;
      msg.className = 'msg error';
      msg.style.display = 'block';
      uploadBtn.disabled = false;
      return;
    }
    uploadedPhoto = null;
    photoPreview.style.display = 'none';
    uploadZone.classList.remove('filled');
    uploadText.textContent = 'Toca para subir la foto';
    renderProgress(res.beerCount, true);
  } catch(e){
    msg.textContent = 'No se pudo conectar con el servidor.';
    msg.className = 'msg error';
    msg.style.display = 'block';
    uploadBtn.disabled = false;
  }
});

// ---------- Ruleta ----------
function buildWheel(){
  const wheel = document.getElementById('wheel');
  let cumulative = 0;
  const stops = [];
  PRIZES.forEach(p => {
    const start = cumulative;
    const end = cumulative + p.weight;
    stops.push(`${p.color} ${start*3.6}deg ${end*3.6}deg`);
    cumulative = end;
  });
  wheel.style.background = `conic-gradient(${stops.join(',')})`;

  cumulative = 0;
  PRIZES.forEach(p => {
    const mid = (cumulative + p.weight/2) * 3.6;
    cumulative += p.weight;
    const label = document.createElement('div');
    label.className = 'slice-label';
    label.textContent = p.label;
    // .slice-label parte "acostada" hacia la derecha (3 en punto) por el
    // width+text-align:right, no hacia arriba, así que hay que restar 90°
    // para que quede alineada con su porción real del conic-gradient.
    label.style.transform = `rotate(${mid - 90}deg)`;
    wheel.appendChild(label);
  });
}
buildWheel();

function pickPrize(){
  const total = PRIZES.reduce((s,p)=>s+p.weight,0);
  let r = Math.random() * total;
  for (const p of PRIZES){
    if (r < p.weight) return p;
    r -= p.weight;
  }
  return PRIZES[0];
}

function angleForPrize(prize){
  let cumulative = 0;
  for (const p of PRIZES){
    if (p.id === prize.id) return (cumulative + p.weight/2) * 3.6;
    cumulative += p.weight;
  }
  return 0;
}

document.getElementById('spinBtn').addEventListener('click', async () => {
  document.getElementById('spinBtn').disabled = true;
  const wheelStage = document.getElementById('wheelStage');
  const wheel = document.getElementById('wheel');
  wheelStage.style.display = 'flex';
  document.getElementById('appCard').style.opacity = '0.5';
  document.getElementById('appCard').style.pointerEvents = 'none';

  const prize = pickPrize();
  const targetAngle = angleForPrize(prize);
  const spins = 6;
  const finalRotation = spins*360 + (360 - targetAngle);

  // Reseteamos la rueda sin animación y forzamos un reflow, para que el
  // navegador registre el estado inicial antes de animar hacia el resultado.
  wheel.style.transition = 'none';
  wheel.style.transform = 'rotate(0deg)';
  wheel.offsetHeight; // fuerza el reflow
  requestAnimationFrame(() => {
    wheel.style.transition = 'transform 4.5s cubic-bezier(.12,.66,.05,1)';
    wheel.style.transform = `rotate(${finalRotation}deg)`;
  });

  await new Promise(r => setTimeout(r, 4700));

  try {
    const res = await callBackend({ action:'claimPrize', username:session.username, password:session.password, prize: prize.label });
    if (res.error){
      alert(res.error);
      return;
    }
    document.getElementById('resultTitle').textContent = prize.label;
    document.getElementById('resultCode').textContent = res.code;
    document.getElementById('resultBox').style.display = 'block';
    renderProgress(0, false);
  } catch(e){
    alert('No se pudo registrar el premio. Muéstrale esta pantalla al staff.');
  } finally {
    document.getElementById('appCard').style.opacity = '1';
    document.getElementById('appCard').style.pointerEvents = 'auto';
  }
});

// ---------- Panel de staff ----------
document.getElementById('staffToggle').addEventListener('click', () => {
  const panel = document.getElementById('adminPanel');
  panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
});

let staffPin = '';

document.getElementById('pinBtn').addEventListener('click', async () => {
  staffPin = document.getElementById('pinInput').value.trim();
  document.getElementById('adminList').style.display = 'block';
  await loadEntries();
});

document.getElementById('refreshBtn').addEventListener('click', loadEntries);

async function loadEntries(){
  const container = document.getElementById('entriesContainer');
  container.innerHTML = '<div class="empty">Cargando...</div>';
  try {
    const res = await callBackend({ action:'list', pin: staffPin });
    if (res.error){
      container.innerHTML = '<div class="empty">PIN incorrecto.</div>';
      return;
    }
    const list = res.entries || [];
    if (list.length === 0){
      container.innerHTML = '<div class="empty">Aún no hay canjes registrados.</div>';
      return;
    }
    container.innerHTML = '';
    list.forEach(entry => {
      const row = document.createElement('div');
      row.className = 'entry-row';
      const date = new Date(entry.timestamp);
      row.innerHTML = `
        <div class="meta">
          <div><strong>${entry.username}</strong> — ${entry.prize}</div>
          <div class="code-tag">${entry.code}</div>
          <div style="opacity:.6">${date.toLocaleDateString('es-CL')}</div>
        </div>
        <div style="display:flex;flex-direction:column;align-items:flex-end;gap:6px">
          <span class="badge ${entry.redeemed ? 'done' : 'pending'}">${entry.redeemed ? 'Canjeado' : 'Pendiente'}</span>
          ${!entry.redeemed ? `<button class="mini-btn" data-code="${entry.code}">Marcar canjeado</button>` : ''}
        </div>
      `;
      container.appendChild(row);
    });
    container.querySelectorAll('.mini-btn[data-code]').forEach(btn => {
      btn.addEventListener('click', async () => {
        const code = btn.getAttribute('data-code');
        await callBackend({ action:'markRedeemed', code, pin: staffPin });
        loadEntries();
      });
    });
  } catch(e) {
    container.innerHTML = '<div class="empty">No se pudieron cargar los canjes.</div>';
  }
}
</script>
</body>
</html>
